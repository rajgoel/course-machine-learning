<svg width="660" height="450" xmlns="http://www.w3.org/2000/svg">
<!-- connections from layer1 -> layer2 based on graph -->
<g data-id="gnn-links" stroke="lightgray" stroke-width="3">
  <!-- A connections -->
  <line data-id="AB" x1="200" y1="100" x2="500" y2="200" />
  <line data-id="AC" x1="200" y1="100" x2="500" y2="300" />
  <!-- B connections -->
  <line data-id="BA" x1="200" y1="200" x2="500" y2="100" />
  <line data-id="BC" x1="200" y1="200" x2="500" y2="300" />
  <line data-id="BD" x1="200" y1="200" x2="500" y2="400" />
  <!-- C connections -->
  <line data-id="CA" x1="200" y1="300" x2="500" y2="100" />
  <line data-id="CB" x1="200" y1="300" x2="500" y2="200" />
  <line data-id="CD" x1="200" y1="300" x2="500" y2="400" />
  <!-- D connections -->
  <line data-id="DB" x1="200" y1="400" x2="500" y2="200" />
  <line data-id="DC" x1="200" y1="400" x2="500" y2="300" />
</g>


<g data-id="gnn-self-links" stroke="lightgray" stroke-width="3">
  <line x1="200" y1="100" x2="500" y2="100" />
  <line x1="200" y1="200" x2="500" y2="200" />
  <line x1="200" y1="300" x2="500" y2="300" />
  <line x1="200" y1="400" x2="500" y2="400" />
</g>

<g data-id="layer1">
  <text x="200" y="50" font-size="30" fill="black" text-anchor="middle"> GNN layer 𝑖 </text>

  <g>
    <circle cx="200" cy="100" r="25" stroke="firebrick" stroke-width="4" fill="lightgray" />
    <text x="200" y="112.5" font-size="40" fill="black" text-anchor="middle"> A </text>
  </g>
  
  <g>
    <circle cx="200" cy="200" r="25" stroke="firebrick" stroke-width="4" fill="lightgray" />
    <text x="200" y="212.5" font-size="40" fill="black" text-anchor="middle"> B </text>
  </g>
  
  <g>
    <circle cx="200" cy="300" r="25" stroke="firebrick" stroke-width="4" fill="lightgray" />
    <text x="200" y="312.5" font-size="40" fill="black" text-anchor="middle"> C </text>
  </g>
  
  <g>
    <circle cx="200" cy="400" r="25" stroke="firebrick" stroke-width="4" fill="lightgray" />
    <text x="200" y="412.5" font-size="40" fill="black" text-anchor="middle"> D </text>
  </g>
</g>

<g data-id="layer2">
  <text x="500" y="50" font-size="30" fill="black" text-anchor="middle"> GNN layer 𝑗 </text>

  <g>
    <circle cx="500" cy="100" r="25" stroke="firebrick" stroke-width="4" fill="lightgray" />
    <text x="500" y="112.5" font-size="40" fill="black" text-anchor="middle"> A </text>
  </g>
  
  <g>
    <circle cx="500" cy="200" r="25" stroke="firebrick" stroke-width="4" fill="lightgray" />
    <text x="500" y="212.5" font-size="40" fill="black" text-anchor="middle"> B </text>
  </g>
  
  <g>
    <circle cx="500" cy="300" r="25" stroke="firebrick" stroke-width="4" fill="lightgray" />
    <text x="500" y="312.5" font-size="40" fill="black" text-anchor="middle"> C </text>
  </g>
  
  <g>
    <circle cx="500" cy="400" r="25" stroke="firebrick" stroke-width="4" fill="lightgray" />
    <text x="500" y="412.5" font-size="40" fill="black" text-anchor="middle"> D </text>
  </g>
</g>

