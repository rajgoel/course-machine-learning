<?xml version="1.0" encoding="UTF-8"?>
<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="150" height="150" fill="green"/>
    
    <!-- Grid lines -->
    <g stroke="black" stroke-width="3">
        <line x1="50" y1="0" x2="50" y2="150"/>
        <line x1="100" y1="0" x2="100" y2="150"/>
        <line x1="0" y1="50" x2="150" y2="50"/>
        <line x1="0" y1="100" x2="150" y2="100"/>
        
        <!-- External border -->
        <rect x="0" y="0" width="150" height="150" fill="none" stroke="black" stroke-width="3"/>
    </g>
    
    <!-- Grid -->
    <g font-family="Arial" font-size="24" text-anchor="middle" fill="black">
        <!-- First row -->
        <text x="25" y="35">1</text>
        <text x="75" y="35">0</text>
        <text x="125" y="35">-1</text>
        
        <!-- Second row -->
        <text x="25" y="80">-2</text>
        <text x="75" y="80">0</text>
        <text x="125" y="80">2</text>
        
        <!-- Third row -->
        <text x="25" y="130">-1</text>
        <text x="75" y="130">0</text>
        <text x="125" y="130">1</text>
    </g>
</svg>