dGlyphs" textLength="35" x="28" y="190.4802">loop</text><text fill="#000000" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="96" x="108" y="191.4802">[for t=1 to T]</text><line style="stroke: #000000; stroke-width: 1.0;" x1="879" x2="921" y1="250.7523" y2="250.7523"/><line style="stroke: #000000; stroke-width: 1.0;" x1="921" x2="921" y1="250.7523" y2="263.7523"/><line style="stroke: #000000; stroke-width: 1.0;" x1="880" x2="921" y1="263.7523" y2="263.7523"/><polygon fill="#000000" points="890,259.7523,880,263.7523,890,267.7523,886,263.7523" style="stroke: #000000; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacingAndGlyphs" textLength="264" x="886" y="244.0643">Wₜ ← get_exogenous_information()</text><line style="stroke: #000000; stroke-width: 1.0;" x1="299.5" x2="341.5" y1="299.5443" y2="299.5443"/><line style="stroke: #000000; stroke-width: 1.0;" x1="341.5" x2="341.5" y1="299.5443" y2="312.5443"/><line style="stroke: #000000; stroke-width: 1.0;" x1="300.5" x2="341.5" y1="312.5443" y2="312.5443"/><polygon fill="#000000" points="310.5,308.5443,300.5,312.5443,310.5,316.5443,306.5,312.5443" style="stroke: #000000; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacingAndGlyphs" textLength="118" x="306.5" y="292.8563">Xₜ ← decide(Sₜ₋₁)</text><polygon fill="#000000" points="857,344.3363,867,348.3363,857,352.3363,861,348.3363" style="stroke: #000000; stroke-width: 1.0;"/><line style="stroke: #000000; stroke-width: 1.0;" x1="299.5" x2="863" y1="348.3363" y2="348.3363"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacingAndGlyphs" textLength="135" x="306.5" y="341.6483">make_decision(Xₜ)</text><line style="stroke: #000000; stroke-width: 1.0;" x1="879" x2="921" y1="384.1284" y2="384.1284"/><line style="stroke: #000000; stroke-width: 1.0;" x1="921" x2="921" y1="384.1284" y2="397.1284"/><line style="stroke: #000000; stroke-width: 1.0;" x1="880" x2="921" y1="397.1284" y2="397.1284"/><polygon fill="#000000" points="890,393.1284,880,397.1284,890,401.1284,886,397.1284" style="stroke: #000000; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacingAndGlyphs" textLength="126" x="886" y="377.4404">Sₜ ← g(Sₜ₋₁, Xₜ, Wₜ)</text><line style="stroke: #000000; stroke-width: 1.0;" x1="879" x2="921" y1="432.9204" y2="432.9204"/><line style="stroke: #000000; stroke-width: 1.0;" x1="921" x2="921" y1="432.9204" y2="445.9204"/><line style="stroke: #000000; stroke-width: 1.0;" x1="880" x2="921" y1="445.9204" y2="445.9204"/><polygon fill="#000000" points="890,441.9204,880,445.9204,890,449.9204,886,445.9204" style="stroke: #000000; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacingAndGlyphs" textLength="114" x="886" y="426.2324">rₜ ← f(Sₜ) - f(Sₜ₋₁)</text><polygon fill="#000000" points="310.5,477.7125,300.5,481.7125,310.5,485.7125,306.5,481.7125" style="stroke: #000000; stroke-width: 1.0;"/><line style="stroke: #000000; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="304.5" x2="868" y1="481.7125" y2="481.7125"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacingAndGlyphs" textLength="133" x="316.5" y="475.0245">reward rₜ, state Sₜ</text><line style="stroke: #000000; stroke-width: 1.0;" x1="299.5" x2="341.5" y1="537.5045" y2="537.5045"/><line style="stroke: #000000; stroke-width: 1.0;" x1="341.5" x2="341.5" y1="537.5045" y2="550.5045"/><line style="stroke: #000000; stroke-width: 1.0;" x1="300.5" x2="341.5" y1="550.5045" y2="550.5045"/><polygon fill="#000000" points="310.5,546.5045,300.5,550.5045,310.5,554.5045,306.5,550.5045" style="stroke: #000000; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="16" lengthAdjust="spacingAndGlyphs" textLength="134" x="306.5" y="530.8165">learn(Sₜ₋₁, Xₜ, rₜ, Sₜ)</text><!--MD5=[6cad20080f7add91d8c6744524cba03d]
@startuml
skinparam ParticipantPadding 240
skinparam defaultFontSize 16
participant Agent
participant Environment
||20||
activate Agent
activate Environment
Agent -> Environment: get_state()
Agent <- - Environment: state S₀
||20||
loop for t=1 to T
||20||
    Environment -> Environment: Wₜ ← get_exogenous_information()
    Agent -> Agent: Xₜ ← decide(Sₜ₋₁)
    Agent -> Environment: make_decision(Xₜ)
    Environment -> Environment: Sₜ ← g(Sₜ₋₁, Xₜ, Wₜ)
    Environment -> Environment: rₜ ← f(Sₜ) - f(Sₜ₋₁)
    Agent <- - Environment: reward rₜ, state Sₜ
||20||

    Agent -> Agent: learn(Sₜ₋₁, Xₜ, rₜ, Sₜ)
||20||
end
||20||
deactivate Agent
deactivate Environment
@enduml

